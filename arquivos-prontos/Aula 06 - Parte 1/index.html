<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeose HTML 5</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>iFrames</h1>

    <iframe src="https://www.grupointegrado.br"></iframe>
    
    <h2>Youtube - Cospobre</h2>

    <iframe width="1048" height="590" src="https://www.youtube.com/embed/VWHfxLR1o5Q"></iframe>

    <h2>Vídeo no Navegador</h2>

    <video preload="auto" controls width="640" height="480">
        <source src="midias/video.mp4" type="video/mp4">
    </video>

    <h2>Audio no Navegador</h2>

    <audio controls>
        <source src="midias/audio.mp3" type="audio/mp3">
    </audio>
</body>
</html>
