<!DOCTYPE html>
<html lang="pt-br">
<head>
	<title>Minha Primeira Página HTML</title>
	<meta charset="utf-8">

	<style>
		body {
			margin: 0;
			font-family: Arial;
			background: #333;
		}
		header {
			width: 100%;
			padding: 20px;
			background: #000;
			h1 {
				text-align: center;
				color: #FFF;
			}
			img {
				width: 400px;
			}
		}
		nav {
			width: 100%;
			background: #666;
			text-align: center;
			padding: 10px;
			margin-bottom: 20px;
			a {
				color: #FFF;
				text-decoration: none;
			}
			a:hover {
				color: red;
			}
		}
		main {
			width: 800px;
			background: #FFF;
			border-radius: 10px;
			padding: 10px;
			margin: auto;
		}
		footer {
			background: #000;
			color: #FFF;
			text-decoration: none;
			margin-top: 20px;
			padding: 10px;
			p {
				text-align: center;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1>
			<img src="imgs/logo-negativa.png" alt="Integrado">
		</h1>
	</header>
	<nav>
		<a href="index.html">Primeira Página</a>
		<a href="ex2.html">Segunda Página</a>
	</nav>
	<main>
		<h2>Aqui vai o conteúdo principar do seu site!</h2>
		<p>Texto</p>
	</main>
	<footer>
		<p>Desenvolvido por Seu Nome</p>
	</footer>
</body>
</html>
